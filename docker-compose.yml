# OCapistaine - Docker Compose
# Full stack: Streamlit + FastAPI + Redis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8502:8502"  # Streamlit UI
      - "8050:8050"  # FastAPI backend
    environment:
      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # LLM Providers (set via .env or override)
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      # Opik observability
      - OPIK_API_KEY=${OPIK_API_KEY}
      - OPIK_WORKSPACE=${OPIK_WORKSPACE}
      # Firecrawl
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./ext_data:/app/ext_data:ro
      - ./.streamlit:/app/.streamlit:ro
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:

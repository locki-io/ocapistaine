# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ocapistaine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard  # 2GB RAM - needed for AI packages (anthropic, opik, litellm)
    # Render sets PORT env var - our entrypoint uses it for Streamlit
    envVars:
      # Memory optimization for free tier
      - key: DISABLE_SCHEDULER
        value: "true"
      # Authentication (set in Render dashboard for security)
      - key: STREAMLIT_AUTH_PASSWORD
        sync: false
      # Streamlit CORS settings
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: STREAMLIT_SERVER_ALLOWED_ORIGINS
        value: "https://ocapistaine.onrender.com,https://ocapistaine.vaettir.locki.io,https://vaettir.locki.io,https://cap.audierne2026.fr"
      # LLM Providers
      - key: DEFAULT_PROVIDER
        value: openai
      # Document processing uses Claude (better for long context/chunking)
      - key: DOCUMENT_PROVIDER
        value: claude
      - key: DOCUMENT_MODEL
        value: sonnet
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_STUDIO_API_KEY
        sync: false
      # Observability
      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        value: ocapistaine-dev
      # External Redis (Upstash) - configure in Render dashboard
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
    healthCheckPath: /
    autoDeploy: true
